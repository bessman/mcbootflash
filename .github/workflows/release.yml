name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  set-body:
    runs-on: ubuntu-latest

    steps:
    - run: sudo apt install pcregrep

    - uses: actions/checkout@v4
    
    - name: Assert tag matches version string in changelog
      id: assert-version
      run: |
          tag='${{ github.ref_name }}'
          re_date='(\d{4}-(?:0[1-9]|1[012])-(?:0[1-9]|[12][0-9]|3[01]))'
          re_tag_date='## \[($tag)\] - '"$re_date"'\n\n'
          tag_ok=$(pcregrep -M -o1 "$re_tag_date" ./CHANGELOG.md)
          
          if [[ -z "$tag_ok" ]]; then
              ####
          
          date_found=$(pcregrep -M -o2 "$re_tag_date" ./CHANGELOG.md)
          
          if [[ "$date_found" == $(date '+%Y-%m-%d') ]]; then
              date_ok=1;
          fi
          
          release_url='https:\/\/github\.com\/bessman\/mcbootflash\/releases\/tag\/'
          re_url='\[$tag\]: '"$release_url"'$tag\n'
          url_ok=$(pcregrep -M "$re_url" ./CHANGELOG.md)
          if [[ -z "$tag_ok" || -z "$date_ok" || -z "$url_ok" ]]; then
              echo "" >> $GITHUB_OUTPUT
              # Match multiple lines, output capture group 1.
              pcregrep -M -o1 "$re_full" ./CHANGELOG.md >> $GITHUB_OUTPUT
              echo 'EOF' >> $GITHUB_OUTPUT

    - name: Parse changelog
      id: parse-changelog
      run: |
          tag='${{ github.ref_name }}'
          re_current_tag="## \[$tag\].*\n\n" # Match, but do not capture, current version tag, then...
          re_changes_body='((.|\n)+?)' # capture everything including newlines...
          re_previous_tag='## \[[0-9]+.[0-9]+.[0-9]+\]' # until previous version tag.
          re_full="${re_current_tag}${re_changes_body}${re_previous_tag}"
          echo 'match<<EOF' >> $GITHUB_OUTPUT
          # Match multiple lines, output capture group 1.
          pcregrep -M -o1 "$re_full" ./CHANGELOG.md >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

    - name: Set release body
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        body: ${{ steps.parse-changelog.outputs.match }}

  build:
    uses: bessman/mcbootflash/.github/workflows/build.yml@main

  attach-artifacts:
    needs: build

    runs-on: ubuntu-latest

    steps:
    - name: download
      uses: actions/download-artifact@v4

    # Artifacts are tar'd to preserve permissions.
    - name: untar
      run: |
        tar -xf linux/mcbootflash.tar -C linux
        tar -xf macos/mcbootflash.tar -C macos
        tar -xf windows/mcbootflash.tar -C windows

    - name: zip
      run: |
        zip -rj linux.zip linux/dist/*
        zip -rj macos.zip macos/dist/*
        zip -rj windows.zip windows/dist/*

    - name: attach
      uses: softprops/action-gh-release@v2
      with:
        files: |
          linux.zip
          macos.zip
          windows.zip

  pypi-publish:
    runs-on: ubuntu-latest

    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: build wheel and sdist
        run: |
          pip install flit
          flit build

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
